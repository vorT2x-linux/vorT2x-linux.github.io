<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0b1220"/>
<stop offset="1" stop-color="#0f2438"/>
</linearGradient>
<radialGradient id="glow" cx="0.72" cy="0.48" r="0.45">
<stop offset="0" stop-color="#38bdf8" stop-opacity="0.26"/>
<stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1.4" fill="#38bdf8" opacity="0.10"/>
</pattern>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#13304a"/>
<stop offset="0.55" stop-color="#1a2f5c"/>
<stop offset="1" stop-color="#0f2438"/>
</linearGradient>
<linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
<stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.55"/>
<stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<rect width="1600" height="900" fill="url(#glow)"/>

<!-- the iMac Pro: one picture across both tiles -->
<g transform="translate(1150 430)">
  <!-- stand -->
  <path d="M -60 196 L -78 282 H 78 L 60 196 Z" fill="#0b1220" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round"/>
  <rect x="-120" y="280" width="240" height="12" rx="6" fill="#38bdf8" opacity="0.9"/>
  <!-- body and screen -->
  <rect x="-330" y="-224" width="660" height="424" rx="20" fill="#0b1220" stroke="#38bdf8" stroke-width="6"/>
  <rect x="-308" y="-202" width="616" height="346" rx="6" fill="url(#screen)"/>

  <!-- desktop: a window that crosses the seam in one piece -->
  <rect x="-308" y="-202" width="616" height="22" fill="#0b1220" opacity="0.55"/>
  <g>
    <rect x="-170" y="-130" width="340" height="210" rx="12" fill="#0b1220" stroke="#818cf8" stroke-width="3"/>
    <rect x="-170" y="-130" width="340" height="30" rx="12" fill="#818cf8" opacity="0.22"/>
    <circle cx="-148" cy="-115" r="5" fill="#818cf8"/>
    <circle cx="-131" cy="-115" r="5" fill="#818cf8" opacity="0.6"/>
    <circle cx="-114" cy="-115" r="5" fill="#818cf8" opacity="0.35"/>
    <g transform="translate(-30 -66) scale(0.95)"><path d="M32 12a20 20 0 1 1-19.6 24" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/><circle cx="32" cy="32" r="6" fill="#38bdf8"/></g>
    <rect x="-110" y="30" width="220" height="8" rx="4" fill="#38bdf8" opacity="0.5"/>
    <rect x="-80" y="48" width="160" height="8" rx="4" fill="#38bdf8" opacity="0.28"/>
  </g>
  <!-- pointer on the right half -->
  <path d="M 196 -24 l 0 44 l 11 -11 l 9 20 l 8 -4 l -9 -19 l 16 0 z" fill="#ffffff" stroke="#0b1220" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- where the two tiles meet -->
  <rect x="-1.5" y="-202" width="3" height="346" fill="url(#seam)"/>
  <!-- chin -->
  <rect x="-24" y="166" width="48" height="6" rx="3" fill="#38bdf8" opacity="0.35"/>

  <!-- labels -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#8fb4d6">
    <text x="-154" y="-262" text-anchor="middle">2560 × 2880</text>
    <text x="154" y="-262" text-anchor="middle">2560 × 2880</text>
  </g>
  <path d="M -306 -250 v 10 h 296 v -10 M 306 -250 v 10 h -296 v -10" fill="none" stroke="#8fb4d6" stroke-width="2" opacity="0.6"/>
  <g font-family="DejaVu Sans, Verdana, sans-serif" font-weight="bold" font-size="24" fill="#38bdf8">
    <text x="0" y="340" text-anchor="middle">= one 5120 × 2880 display</text>
  </g>
</g>

<!-- text -->
<g transform="translate(120 230) scale(0.62)"><g transform="translate(4 4) scale(1.375)"><path d="M32 12a20 20 0 1 1-19.6 24" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
<circle cx="32" cy="32" r="6" fill="#38bdf8"/></g>
<text x="108" y="69" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="bold" font-size="58" letter-spacing="-1" fill="#ffffff">Vor<tspan fill="#38bdf8">T2</tspan>x</text></g>
<text x="120" y="400" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="bold" font-size="80" letter-spacing="-2" fill="#ffffff">One 5K</text>
<text x="120" y="494" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="bold" font-size="80" letter-spacing="-2" fill="#ffffff">display on</text>
<text x="120" y="588" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="bold" font-size="80" letter-spacing="-2" fill="#38bdf8">the iMac Pro</text>
<text x="122" y="664" font-family="DejaVu Sans, Verdana, sans-serif" font-size="30" fill="#a8bdd2">Two tiles, one picture, no tear</text>
<rect x="122" y="710" width="96" height="6" rx="3" fill="#38bdf8"/>
</svg>
