<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0b1220"/>
<stop offset="1" stop-color="#0f2438"/>
</linearGradient>
<radialGradient id="glow" cx="0.72" cy="0.48" r="0.45">
<stop offset="0" stop-color="#38bdf8" stop-opacity="0.26"/>
<stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1.4" fill="#38bdf8" opacity="0.10"/>
</pattern>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#13304a"/>
<stop offset="0.55" stop-color="#1a2f5c"/>
<stop offset="1" stop-color="#0f2438"/>
</linearGradient>
<linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#38bdf8"/>
<stop offset="0.7" stop-color="#818cf8"/>
<stop offset="1" stop-color="#f472b6"/>
</linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<rect width="1600" height="900" fill="url(#glow)"/>

<g transform="translate(1150 430)">
  <!-- stand -->
  <path d="M -60 196 L -78 282 H 78 L 60 196 Z" fill="#0b1220" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round"/>
  <rect x="-120" y="280" width="240" height="12" rx="6" fill="#38bdf8" opacity="0.9"/>
  <!-- body and screen -->
  <rect x="-330" y="-224" width="660" height="424" rx="20" fill="#0b1220" stroke="#38bdf8" stroke-width="6"/>
  <rect x="-308" y="-202" width="616" height="346" rx="6" fill="url(#screen)"/>

  <!-- a game on screen: horizon, hills and a crosshair -->
  <path d="M -308 60 L -200 10 L -110 44 L -10 -18 L 90 36 L 190 -4 L 308 48 V 144 H -308 Z" fill="#0b1220" opacity="0.55"/>
  <path d="M -308 60 L -200 10 L -110 44 L -10 -18 L 90 36 L 190 -4 L 308 48" fill="none" stroke="#818cf8" stroke-width="3" opacity="0.8"/>
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
    <path d="M 0 -96 v -22 M 0 -60 v 22 M -18 -78 h -22 M 18 -78 h 22"/>
  </g>
  <circle cx="0" cy="-78" r="3" fill="#ffffff"/>

  <!-- HUD: GPU clock held, fans at full -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#8fb4d6">
    <rect x="-290" y="-186" width="196" height="58" rx="8" fill="#0b1220" opacity="0.7" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="-276" y="-162">GPU  1201 MHz</text>
    <text x="-276" y="-138">FANS 2500 rpm</text>
  </g>
  <!-- chin -->
  <rect x="-24" y="166" width="48" height="6" rx="3" fill="#38bdf8" opacity="0.35"/>

  <!-- fan beside the iMac, with air moving -->
  <g transform="translate(-410 -120)">
    <circle r="56" fill="#0b1220" stroke="#38bdf8" stroke-width="5"/>
    <g fill="#38bdf8" opacity="0.85">
      <path d="M 0 0 C 8 -18 30 -34 40 -18 C 30 -10 14 -4 0 0 Z"/>
      <path d="M 0 0 C 8 -18 30 -34 40 -18 C 30 -10 14 -4 0 0 Z" transform="rotate(120)"/>
      <path d="M 0 0 C 8 -18 30 -34 40 -18 C 30 -10 14 -4 0 0 Z" transform="rotate(240)"/>
    </g>
    <circle r="8" fill="#38bdf8"/>
    <g fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.5">
      <path d="M -40 84 q 20 -12 40 0 t 40 0"/>
      <path d="M -30 106 q 15 -10 30 0 t 30 0" opacity="0.6"/>
    </g>
  </g>

  <!-- temperature bar that stays under the line -->
  <g transform="translate(372 -200)">
    <rect x="0" y="0" width="26" height="300" rx="13" fill="#0b1220" stroke="#38bdf8" stroke-width="4"/>
    <rect x="5" y="70" width="16" height="225" rx="8" fill="url(#heat)"/>
    <path d="M -10 40 h 46" stroke="#f472b6" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="13" y="-16" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#f9a8d4">sleep</text>
  </g>

  <g font-family="DejaVu Sans, Verdana, sans-serif" font-weight="bold" font-size="24" fill="#38bdf8">
    <text x="0" y="340" text-anchor="middle">fans first · clocks held · no sudden sleep</text>
  </g>
</g>

<!-- text -->
<g transform="translate(120 230) scale(0.62)"><g transform="translate(4 4) scale(1.375)"><path d="M32 12a20 20 0 1 1-19.6 24" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
<circle cx="32" cy="32" r="6" fill="#38bdf8"/></g>
<text x="108" y="69" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="bold" font-size="58" letter-spacing="-1" fill="#ffffff">Vor<tspan fill="#38bdf8">T2</tspan>x</text></g>
<text x="120" y="400" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="bold" font-size="80" letter-spacing="-2" fill="#ffffff">Tuning the</text>
<text x="120" y="494" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="bold" font-size="80" letter-spacing="-2" fill="#ffffff">T2 iMacs</text>
<text x="120" y="588" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="bold" font-size="80" letter-spacing="-2" fill="#38bdf8">for gaming</text>
<text x="122" y="664" font-family="DejaVu Sans, Verdana, sans-serif" font-size="30" fill="#a8bdd2">Smarter fans, steadier power</text>
<rect x="122" y="710" width="96" height="6" rx="3" fill="#38bdf8"/>
</svg>
